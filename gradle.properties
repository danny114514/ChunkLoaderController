# ── Gradle 行为 ────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx1G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存在 9.x 已默认开启，显式写出来是为了让人知道这是有意为之
org.gradle.configuration-cache=true

# ── 依赖解析 ───────────────────────────────────────────────────────────────
# folia-api 是 SNAPSHOT（1.20.1-R0.1-SNAPSHOT）。默认 SNAPSHOT 缓存 24 小时；
# 本插件的弱加载依赖特定 NMS 符号，换服务端构建后需要立刻拿到对应的 API 版本，
# 所以这里加一些重试而不是激进地取消缓存（那会让每次构建都重新下载）。
systemProp.org.gradle.internal.repository.max.retries=3

# ── 编译依赖的唯一来源 ─────────────────────────────────────────────────────
# 本工程只依赖 dev.folia:folia-api（见 build.gradle）。若无法访问
# repo.papermc.io，构建会失败 —— 这是有意的：静态地"假装编译成功"没有意义，
# 因为弱加载是否正确只能通过 /cl admin selftest 在真实服务端上验证。
