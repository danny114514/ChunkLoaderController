# ============================================================================
#  ChunkLoaderController 配置
#  改完用 /cl admin reload 生效（已控制的区块不会被改动）
# ============================================================================

# ── 配额（按世界独立计数）──────────────────────────────────
# 每玩家「每个世界」的受控区块总量上限
max-total-chunks: 45
# 每玩家「每个世界」的强加载区块上限（本质是实体刻配额）
max-strong-chunks: 9
# 全服「跨所有世界」的受控区块总量上限
global-max-total-chunks: 500
# 全服「跨所有世界」的强加载区块上限
global-max-strong-chunks: 100
# 实测已加载区块总数超过此值时只记警告，不拒绝操作
global-loaded-warn-threshold: 300

# true = 配额按世界独立计数
quota-per-world: true
# false = 配额收紧后不追溯已有记录，只禁新增
quota-strict-on-shrink: false

# ── 生命周期 ──────────────────────────────────────────────────────────────
# false = 玩家下线/服务器重启后保留控制并恢复
release-on-logout: false
# 0 = 不自动释放，只能管理员手动 release
auto-release-idle-days: 0

# ── 日志 ──────────────────────────────────────────────────────────────────
# 审计日志保留天数，0 = 永不清理；每天检查一次
log-retention-days: 90

# ── GUI ───────────────────────────────────────────────────────────────────
# 0 = 只在打开时读取一次，靠底部「刷新」按钮
refresh-interval: 0
# none | 3x3 —— 默认不补缓冲圈
block-ticking-buffer: none
# 首次设置弱加载时聊天框提示「实体冻结」
warn-on-weak-set: true

# ── 存储 ──────────────────────────────────────────────────────────────────
# immediate = 每次操作立即落库
write-mode: immediate
database:
  # v1 只实现 sqlite；mysql 为 v2 预留
  type: sqlite
  file: data.db

# ── 杂项 ──────────────────────────────────────────────────────────────────
language: zh_CN
# 固定 32 = BLOCK_TICKING；不建议修改（改动会偏离「弱加载」的定义）
weak-ticket-level: 32
# 固定 31 = ENTITY_TICKING；不建议修改
strong-ticket-level: 31

# ── 彩蛋 ──────────────────────────────────────────────────────────────────
# 一个隐藏的闲聊彩蛋。触发方式不写在这里 —— 写出来就不叫彩蛋了。
#
# 这里的开关只控制「开不开」，不决定触发内容；触发词固定在代码里，
# 因此换触发词要重新编译（有意为之：避免配置文件被一眼看穿）。
easter-egg:
  # false = 完全关闭
  enabled: true
  # lightning = 真实闪电（有伤害、会点燃）；effect = 只有视觉效果
  mode: lightning
  # 冷却秒数：防止刷屏连续触发把玩家劈死，也防止刷实体拖慢服务端
  cooldown-seconds: 5
